services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8002}:8002"
    environment:
      APP_NAME: "SWCA Timer"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8002}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-swca_timer}
      DB_USERNAME: ${DB_USERNAME:-swca}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - default
      - proxy

  mysql:
    image: mysql:8.4
    # Pas de port publie sur l'hote : l'app joint MySQL via le reseau Docker (mysql:3306).
    # Pour y acceder depuis le serveur, decommenter en choisissant un port libre :
    # ports:
    #   - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-swca_timer}
      MYSQL_USER: ${DB_USERNAME:-swca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-swca}", "-p${DB_PASSWORD:-secret}", "-e", "SELECT 1", "${DB_DATABASE:-swca_timer}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  app_storage:
  app_cache:
  mysql_data:

networks:
  # Reseau externe du reverse proxy (Caddy) : il joint l'app via swcatimer-app-1:8002.
  # A creer une fois s'il n'existe pas : docker network create proxy
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
