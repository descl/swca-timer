services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "SWCA Timer"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:2yRAOlgR8US4gh9ZrUwgqOM82DM5c0VhLhykhhZGSIE=}
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-swca_timer}
      DB_USERNAME: ${DB_USERNAME:-swca}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache

  mysql:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-swca_timer}
      MYSQL_USER: ${DB_USERNAME:-swca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  app_storage:
  app_cache:
  mysql_data:
